<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TicketAlert – Réservation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f8fb;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--ac:#1f4e79;--on:#fff;--ac2:#dce6f1;--ln:#dde3ea;--ok:#1d7a46}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--tx:#e8edf3;--mu:#98a6b5;--ac:#7fb2e5;--on:#10161d;--ac2:#22364a;--ln:#2a3644;--ok:#5fd08e}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--tx:#e8edf3;--mu:#98a6b5;--ac:#7fb2e5;--on:#10161d;--ac2:#22364a;--ln:#2a3644;--ok:#5fd08e}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:4px 0 0;color:var(--ac)}
.steps{display:flex;gap:6px;margin:12px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--ln)}
.steps i.on{background:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:8px;font-size:16px}
.opt small{display:block;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 4px;text-align:center;font-size:15px}
.slot small{display:block;font-size:11px;color:var(--mu)}
.slot[disabled]{opacity:.4}
.sel{border-color:var(--ac);background:var(--ac2)}
.btn{display:block;width:100%;background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;margin-top:10px}
.btn.alt{background:var(--ac2);color:var(--ac)}
.link{background:none;border:0;color:var(--mu);padding:8px 0;font-size:14px}
input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:8px}
.err{color:#c0392b;font-size:14px;min-height:18px}
.ticket{text-align:center}
.code{font-size:34px;font-weight:700;letter-spacing:2px;color:var(--ac);margin:6px 0}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--ln);font-size:15px}
.row span:first-child{color:var(--mu)}
.sms{background:var(--ac2);border-radius:12px;padding:12px;margin-top:10px;font-size:14px;text-align:left}
.ok{color:var(--ok);font-weight:600}
.note{font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>TicketAlert</h1>
<div class="steps" id="steps"></div>
<div id="view"></div>
<p class="note">Prototype de démonstration : les agences, les places et les alertes sont simulées.</p>
</main>

<script>
var AG=[{n:"Agence Centre-ville",d:"Avenue principale"},{n:"Agence Marché central",d:"Près du grand marché"},{n:"Agence Zone commerciale",d:"Quartier des affaires"}];
var OP=[{n:"Retrait",d:"Retirer de l’argent au guichet"},{n:"Dépôt",d:"Déposer espèces ou chèque"}];
var PROFIL={8:0.8,9:1.4,10:1.1,11:0.9,12:1.5,13:0.7,14:0.8,15:1.0,16:1.2};
var S={step:0,ag:null,op:null,slot:null,nom:"",tel:"",code:"",fin:0};
function $(i){return document.getElementById(i);}
function pad(n){return n<10?"0"+n:""+n;}
function fmt(m){m=Math.round(m);return Math.floor(m/60)+"h"+pad(m%60);}
function slots(){
  var out=[],i=0,m;
  for(m=480;m<=990;m+=30){
    var h=Math.floor(m/60);
    var pris=(i*3+S.ag*2+(S.op||0))%7;if(pris>6)pris=6;
    out.push({m:m,libres:6-pris,wait:12*PROFIL[h]*3.5/3});
    i++;
  }
  return out;
}
function steps(){
  var h="";for(var i=0;i<5;i++)h+='<i class="'+(i<=S.step?'on':'')+'"></i>';
  $("steps").innerHTML=h;
}
function back(to){return '<button class="link" onclick="go('+to+')">← Retour</button>';}
function go(n){S.step=n;render();window.scrollTo(0,0);}
function pickAg(i){S.ag=i;go(1);}
function pickOp(i){S.op=i;S.slot=null;go(2);}
function pickSlot(m){S.slot=m;render();}
function valider(){
  var nom=$("nom").value.trim(),tel=$("tel").value.replace(/\D/g,"");
  if(!nom){$("err").textContent="Entrez votre nom.";return;}
  if(tel.length<8){$("err").textContent="Entrez un numéro de téléphone valide (8 chiffres minimum).";return;}
  S.nom=nom;S.tel=$("tel").value.trim();
  S.code="TA-"+(1000+Math.floor(Math.random()*9000));
  S.fin=0;go(4);
}
function render(){
  steps();
  var v=$("view"),h="",i;
  if(S.step===0){
    h='<div class="card"><h2>1. Choisissez votre agence</h2>';
    for(i=0;i<AG.length;i++)h+='<button class="opt" onclick="pickAg('+i+')">'+AG[i].n+'<small>'+AG[i].d+'</small></button>';
    h+='</div>';
  }else if(S.step===1){
    h='<div class="card">'+back(0)+'<h2>2. Quelle opération ?</h2>';
    for(i=0;i<OP.length;i++)h+='<button class="opt" onclick="pickOp('+i+')">'+OP[i].n+'<small>'+OP[i].d+'</small></button>';
    h+='</div>';
  }else if(S.step===2){
    var sl=slots();
    h='<div class="card">'+back(1)+'<h2>3. Choisissez un créneau</h2><div class="grid">';
    for(i=0;i<sl.length;i++){
      var s=sl[i],full=s.libres<=0;
      h+='<button class="slot'+(S.slot===s.m?' sel':'')+'"'+(full?' disabled':'')+' onclick="pickSlot('+s.m+')">'+fmt(s.m)+'<small>'+(full?'Complet':s.libres+' place'+(s.libres>1?'s':''))+'</small></button>';
    }
    h+='</div>';
    if(S.slot!==null)h+='<button class="btn" onclick="go(3)">Continuer avec '+fmt(S.slot)+'</button>';
    h+='</div>';
  }else if(S.step===3){
    h='<div class="card">'+back(2)+'<h2>4. Vos informations</h2>'+
      '<input id="nom" placeholder="Nom et prénom" value="'+S.nom.replace(/"/g,"&quot;")+'">'+
      '<input id="tel" type="tel" placeholder="Téléphone (pour l’alerte SMS)" value="'+S.tel.replace(/"/g,"&quot;")+'">'+
      '<div class="err" id="err"></div>'+
      '<button class="btn" onclick="valider()">Réserver mon ticket</button></div>';
  }else{
    var hh=Math.min(16,Math.max(8,Math.floor(S.slot/60)));
    var w=12*PROFIL[hh]*3.5/3;
    var alerte=S.slot-30;
    h='<div class="card ticket"><h2>Votre ticket virtuel</h2><div class="code">'+S.code+'</div>'+
      '<div class="row"><span>Agence</span><span>'+AG[S.ag].n+'</span></div>'+
      '<div class="row"><span>Opération</span><span>'+OP[S.op].n+'</span></div>'+
      '<div class="row"><span>Créneau</span><span>'+fmt(S.slot)+'</span></div>'+
      '<div class="row"><span>Alerte envoyée à</span><span>'+fmt(alerte)+'</span></div>'+
      '<div class="row"><span>Attente sans réservation</span><span>~'+Math.round(w)+' min</span></div>';
    if(S.fin===0){
      h+='<button class="btn alt" onclick="S.fin=1;render()">Simuler l’alerte SMS</button>';
    }else if(S.fin===1){
      h+='<div class="sms"><b>SMS · TicketAlert</b><br>'+S.nom.split(" ")[0]+', c’est bientôt votre tour ! Partez maintenant pour l’'+AG[S.ag].n+' (créneau '+fmt(S.slot)+'). Code : '+S.code+'.</div>'+
         '<button class="btn" onclick="S.fin=2;render()">Je suis arrivé</button>';
    }else if(S.fin===2){
      h+='<div class="sms"><span class="ok">Arrivée confirmée.</span><br>Présentez le code <b>'+S.code+'</b> à l’accueil pour le passage prioritaire.</div>'+
         '<button class="btn" onclick="S.fin=3;render()">J’ai été servi</button>';
    }else{
      h+='<div class="sms"><span class="ok">Merci !</span> Votre temps d’attente réel aide à rendre les estimations plus précises pour les prochains clients.</div>'+
         '<button class="btn alt" onclick="S={step:0,ag:null,op:null,slot:null,nom:\'\',tel:\'\',code:\'\',fin:0};render()">Nouvelle réservation</button>';
    }
    h+='</div>';
  }
  v.innerHTML=h;
}
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
</body>
</html>
